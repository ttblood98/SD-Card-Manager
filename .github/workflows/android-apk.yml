name: Build Android speed-test APK

on:
  push:
    branches: [claude/sd-card-test-setup-7zbhzt]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK (private build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SDCardSpeedTest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
