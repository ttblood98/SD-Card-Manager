<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offload</title>
  <meta name="description" content="Browse a camera SD card like a gallery and copy or move photos into albums, with every copy verified.">
  <meta name="theme-color" content="#1a1d23" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar" id="topbar"></header>
  <div class="filters" id="filters"></div>
  <div id="galleryWrap">
    <div id="gallery"></div>
    <div id="empty"></div>
    <button id="toTop" title="Back to top" aria-label="Back to top"></button>
  </div>
  <footer id="selbar"></footer>
  <div id="pages"></div>
  <div id="viewer"></div>
  <noscript>Offload needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
